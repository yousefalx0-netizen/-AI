<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كشف حضور وغياب المحاضرات</title>
    <style>
        :root {
            --primary-color: #1e3a8a;
            --secondary-color: #3b82f6;
            --bg-color: #f8fafc;
            --border-color: #cbd5e1;
        }
        body {
            font-family: 'Cairo', Tahoma, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 15px;
            color: #1e293b;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .site-header {
            text-align: center;
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .site-header h1 {
            margin: 0 0 5px 0;
            font-size: 1.3rem;
        }
        .site-header p {
            margin: 0;
            font-size: 1rem;
            opacity: 0.95;
        }
        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 15px;
            font-size: 1.2rem;
        }
        .section-title {
            background: #eff6ff;
            color: var(--primary-color);
            padding: 8px 12px;
            border-radius: 6px;
            margin: 15px 0 10px 0;
            font-weight: bold;
            font-size: 1em;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 10px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 3px;
            font-size: 0.85em;
            font-weight: 600;
        }
        input {
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9em;
            font-family: inherit;
        }
        input:focus {
            border-color: var(--secondary-color);
            outline: none;
        }
        .btn {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            font-size: 0.95em;
        }
        .btn:hover {
            background-color: #2563eb;
        }
        .btn-danger {
            background-color: #ef4444;
        }
        .btn-success {
            background-color: #10b981;
        }
        .table-responsive {
            overflow-x: auto;
            margin-top: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 0.85em;
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 6px;
        }
        th {
            background-color: #f1f5f9;
            color: var(--primary-color);
        }
        .attendance-btn {
            cursor: pointer;
            padding: 4px 8px;
            font-weight: bold;
            border-radius: 4px;
            border: 1px solid #ccc;
            background: #fff;
        }
        .present {
            background-color: #d1fae5;
            color: #065f46;
            border-color: #10b981;
        }
        .absent {
            background-color: #fee2e2;
            color: #991b1b;
            border-color: #ef4444;
        }
        .actions-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        /* تخصيص الطباعة ليكون شكل الـ PDF احترافياً ومنظموراً */
        @media print {
            body {
                background: white;
                padding: 0;
            }
            .container {
                box-shadow: none;
                padding: 0;
                max-width: 100%;
            }
            .actions-bar, .add-student-box, .btn-danger, th:last-child, td:last-child {
                display: none !important;
            }
            input {
                border: none;
                background: transparent;
                text-align: center;
                font-weight: bold;
                padding: 0;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="site-header">
        <h1>تصميم مندوب قسم الذكاء الاصطناعي _ مستوى أول</h1>
        <p>اخوكم / يوسف وليد المروني</p>
    </div>

    <h2>📋 كشف حضور وغياب المحاضرات</h2>

    <div class="section-title">بيانات المقرر الدراسي</div>
    <div class="form-grid">
        <div class="input-group">
            <label>اسم المقرر</label>
            <input type="text" value="برمجة عملي">
        </div>
        <div class="input-group">
            <label>التخصص</label>
            <input type="text" value="الذكاء الاصطناعي">
        </div>
        <div class="input-group">
            <label>المستوى</label>
            <input type="text" value="الأول">
        </div>
        <div class="input-group">
            <label>الفصل الدراسي</label>
            <input type="text" value="الأول">
        </div>
        <div class="input-group">
            <label>أستاذ المقرر</label>
            <input type="text" value="د/ هيثم حمزة">
        </div>
        <div class="input-group">
            <label>العام الجامعي</label>
            <input type="text" value="2026-2027م">
        </div>
    </div>

    <div class="section-title">قائمة الطلاب وحالة الحضور</div>
    <div class="add-student-box" style="margin-bottom: 10px; display: flex; gap: 10px;">
        <input type="text" id="newStudentName" placeholder="أدخل اسم الطالب الجديد..." style="flex: 1;">
        <button class="btn btn-success" onclick="addStudent()">+ إضافة طالب</button>
    </div>

    <div class="table-responsive">
        <table id="mainTable">
            <thead>
                <tr id="tableHeaderRow">
                    <th>#</th>
                    <th>اسم الطالب</th>
                    <th>محاضرة 1</th>
                    <th>محاضرة 2</th>
                    <th>محاضرة 3</th>
                    <th>محاضرة 4</th>
                    <th>محاضرة 5</th>
                    <th>نسبة الحضور</th>
                    <th>إجراءات</th>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>
    </div>

    <div class="actions-bar">
        <button class="btn" onclick="window.print()">🖨️ طباعة أو حفظ كملف PDF</button>
        <button class="btn btn-danger" onclick="clearAllStudents()">حذف كل الطلاب</button>
    </div>
</div>

<script>
    let students = [
        "يوسف وليد المروني",
        "محمد البطري",
        "زيد العظهي",
        "ابراهيم الحدادي",
        "نواف السودي",
        "زين العابدين سفيان",
        "عبدالباري عبدالله"
    ];

    let attendanceData = {};
    const lecturesCount = 5;

    function initApp() {
        students.forEach(student => {
            attendanceData[student] = new Array(lecturesCount).fill(true);
        });
        renderTableBody();
    }

    function renderTableBody() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = "";

        students.forEach((student, index) => {
            if (!attendanceData[student]) {
                attendanceData[student] = new Array(lecturesCount).fill(true);
            }

            let tr = document.createElement('tr');
            let rowHTML = `<td>${index + 1}</td><td style="text-align: right; font-weight: bold; padding-right: 8px;">${student}</td>`;

            let presentCount = 0;
            for (let i = 0; i < lecturesCount; i++) {
                let isPresent = attendanceData[student][i];
                if (isPresent) presentCount++;
                let btnClass = isPresent ? "attendance-btn present" : "attendance-btn absent";
                let btnText = isPresent ? "✓" : "✗";
                rowHTML += `<td><button class="${btnClass}" onclick="toggleAttendance('${student}', ${i})">${btnText}</button></td>`;
            }

            let percentage = Math.round((presentCount / lecturesCount) * 100);
            rowHTML += `<td><b>${percentage}%</b></td>`;
            rowHTML += `<td><button class="btn btn-danger" style="padding: 2px 6px; font-size: 0.8em;" onclick="removeStudent('${student}')">حذف</button></td>`;

            tr.innerHTML = rowHTML;
            tbody.appendChild(tr);
        });
    }

    function toggleAttendance(student, lectureIndex) {
        attendanceData[student][lectureIndex] = !attendanceData[student][lectureIndex];
        renderTableBody();
    }

    function addStudent() {
        const nameInput = document.getElementById('newStudentName');
        const name = nameInput.value.trim();
        if (name && !students.includes(name)) {
            students.push(name);
            attendanceData[name] = new Array(lecturesCount).fill(true);
            nameInput.value = "";
            renderTableBody();
        } else {
            alert("الرجاء إدخال اسم صحيح أو أن الاسم موجود مسبقاً.");
        }
    }

    function removeStudent(name) {
        students = students.filter(s => s !== name);
        delete attendanceData[name];
        renderTableBody();
    }

    function clearAllStudents() {
        if (confirm("هل أنت متأكد من حذف جميع الطلاب؟")) {
            students = [];
            attendanceData = {};
            renderTableBody();
        }
    }

    window.onload = initApp;
</script>

</body>
</html>
